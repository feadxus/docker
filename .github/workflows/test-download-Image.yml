name: 测试下载镜像

on:
  workflow_dispatch:

jobs:
  diagnose:
    runs-on: ubuntu-latest
    
    steps:
      - name: Check Network and DNS
        run: |
          echo "========== 网络诊断 =========="
          echo "DNS 解析结果:"
          nslookup registry-1.docker.io
          
          echo ""
          echo "DNS 服务器:"
          cat /etc/resolv.conf
          
          echo ""
          echo "网络路由信息 (到 Docker Hub):"
          traceroute -m 15 registry-1.docker.io || tracepath registry-1.docker.io
          
          echo ""
          echo "当前 IP 信息:"
          curl -s https://ipinfo.io
      
      - name: Test Docker Registry Connection
        run: |
          echo "========== Docker Registry 连接测试 =========="
          
          # 测试连接到 Docker Registry
          echo "连接到 registry-1.docker.io:443"
          nc -zv registry-1.docker.io 443
          
          # 使用 curl 获取响应头信息
          echo ""
          echo "获取服务器信息:"
          curl -I https://registry-1.docker.io/v2/
          
          # 显示 SSL 证书信息
          echo ""
          echo "SSL 证书信息:"
          openssl s_client -connect registry-1.docker.io:443 -servername registry-1.docker.io </dev/null 2>/dev/null | grep -A 2 "subject="
      
      - name: Monitor Pull Speed with tcpdump
        run: |
          echo "========== 拉取镜像并监控连接 =========="
          
          # 注意：tcpdump 需要 sudo，GitHub Actions 默认有权限
          # 这里用更简单的方式 - 使用 curl 测试下载速度
          
          echo "测试 Docker Hub 下载速度:"
          time curl -o /dev/null -s -w "下载速度: %{speed_download} bytes/sec\n" \
            https://registry-1.docker.io/v2/library/alpine/manifests/latest
          
          echo ""
          echo "拉取你的镜像:"
          time docker pull feadxus/comfyui-voxcpm:latest
