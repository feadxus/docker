name: Start Tunnel And Check Public URL

on:
  # 🖱️ 支持手动启动
  workflow_dispatch:
  # ♻️ 每 6 小时自动启动一次
  schedule:
    - cron: "0 */6 * * *"

# 1. 将全局读权限修改为写权限,允许脚本向仓库 push 代码
permissions:
  contents: write

jobs:

  # ==========================================================
  # 🚇 启动 Cloudflare WARP + Docker + Pinggy 隧道并提交端口
  # ==========================================================
  start-tunnel:
    name: 🚇 Job 1 - Start Docker and Pinggy Tunnel
    runs-on: ubuntu-latest
    env:
      GITHUB_RUN_ID: ${{ github.run_id }}
      RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
      AGE_PRIVATE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          # 2. 显式传入具备写权限的默认 Token,防止 git push 报 403
          token: ${{ secrets.GITHUB_TOKEN }}
          
      # 🌍 记录安装 WARP 之前的原始公网 IP
      - name: 🌍 Check Original Public IP
        run: |
          echo "Original Public IP:"
          curl -4s https://api.ipify.org
          echo

      # ☁️ 安装 Cloudflare WARP
      - name: ☁️ Install Cloudflare WARP
        run: |
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg \
            | sudo gpg --yes --dearmor \
            -o /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(. /etc/os-release && echo "$VERSION_CODENAME") main" \
            | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update
          sudo apt-get install -y cloudflare-warp

      # 🔴 启动后台全局抓包 (监听所有接口，定时 5 小时，以日期时间命名)
      - name: 🔴 Start Packet Capture (Background 5 Hour)
        run: |
          TIMESTAMP=$(date +'%Y-%m-%d_%H-%M-%S')
          PCAP_FILE="warp_traffic_${TIMESTAMP}.pcap"
          echo "PCAP_FILE=$PCAP_FILE" >> $GITHUB_ENV
          
          echo "开始后台抓包，保存路径: ./$PCAP_FILE，将在 1 小时后自动停止..."
          
          # 使用 timeout 18000 限制 5 小时，-w 直接写入当前工作目录以便后续 git 提交
          sudo timeout 18000 tcpdump -i any -w ./$PCAP_FILE > /dev/null 2>&1 &
          echo "TCPDUMP_PID=$!" >> $GITHUB_ENV

      # 🚀 启动 WARP 客户端并连接
      - name: 🚀 Start Cloudflare WARP
        run: |
          sudo warp-cli --accept-tos registration new
          sudo warp-cli --accept-tos connect
          sleep 5
          sudo warp-cli --accept-tos status

      # 🛠️ 【新增/核心修复】强制修复 WARP 启动后的 DNS 解析超时问题
      - name: 🛠️ Fix DNS for Docker & WARP
        run: |
          echo "=== 正在修复系统 DNS 解析 ==="
          sudo rm -f /etc/resolv.conf
          echo "nameserver 1.1.1.1" | sudo tee /etc/resolv.conf
          echo "nameserver 8.8.8.8" | sudo tee -a /etc/resolv.conf
          echo "=== 测试 DNS 解析是否正常 ==="
          nslookup registry-1.docker.io || true

      # 🌐 确认 WARP 已接管网络并显示当前使用的代理 IP
      - name: 🌐 Check WARP Public IP
        run: |
          echo "WARP Public IP (After Proxy Enabled):"
          curl -4s https://api.ipify.org
          echo
          echo "Cloudflare Connection Trace:"
          curl -s https://www.cloudflare.com/cdn-cgi/trace | grep '^warp='

      # 🚇 启动 Docker 和你的隧道脚本
      - name: 🚇 Start Docker and Pinggy Tunnel
        run: |
          python3 scripts/start_tunnel.py

      # ⏹️ 确保任务结束或超时前安全停止 tcpdump 并落盘
      - name: ⏹️ Stop Packet Capture (Ensure Finalized)
        if: always()
        run: |
          if [ -n "${{ env.TCPDUMP_PID }}" ]; then
            echo "正在停止抓包进程 (PID: ${{ env.TCPDUMP_PID }})..."
            sudo kill -SIGINT ${{ env.TCPDUMP_PID }} || true
            sleep 3
            
            # 👇 核心修复：把 root 创建的 pcap 文件改回当前 GitHub 运行用户的权限，确保 git 能够读取
            if [ -f "./${{ env.PCAP_FILE }}" ]; then
              sudo chown -R $USER:$USER ./${{ env.PCAP_FILE }}
              echo "已修正 pcap 文件权限: ./${{ env.PCAP_FILE }}"
            fi
          fi

      # 💾 自动将生成的 pcap 流量包提交并 Push 到仓库
      - name: 💾 Commit & Push Packet Capture
        if: always()
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          file_pattern: warp_traffic_*.pcap
          commit_message: "chore: add automated warp traffic pcap ${{ env.PCAP_FILE }}"

  # ==========================================================
  # 🌐 读取最新端口 + 加密 + 上传网盘
  # ==========================================================
  check-public-url:
    name: 🌐 Job 2 - Check Public URL and Process Page
    runs-on: ubuntu-latest
    env:
      GITHUB_RUN_ID: ${{ github.run_id }}
      RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
      AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
      GMAIL_TOKEN_BASE64: ${{ secrets.GMAIL_TOKEN_BASE64 }}
    steps:
      - name: ⏳ Wait for Job 1 to push address
        run: sleep 180

      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 🌐 Check Public URL
        run: |
          git pull origin main || true
          python3 scripts/check_public_url.py

      - name: 📦 Upload downloaded page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-public-page
          path: output/
          if-no-files-found: ignore
