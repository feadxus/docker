name: Start Tunnel And Check Public URL

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  start-tunnel:
    name: 🚇 Job 1 - Start Docker and Pinggy Tunnel
    runs-on: ubuntu-latest
    env:
      GITHUB_RUN_ID: ${{ github.run_id }}
      RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
      AGE_PRIVATE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 🚇 Start Docker and Pinggy Tunnel
        run: |
          python3 scripts/start_tunnel.py

      # 🌟 新增：将生成的文本文件上传至 GitHub 暂存区
      - name: 📤 Upload Tunnel TXT
        uses: actions/upload-artifact@v4
        with:
          name: tunnel-txt-file
          path: current_tunnel.txt

  check-public-url:
    name: 🌐 Job 2 - Check Public URL and Process Page
    runs-on: ubuntu-latest
    needs: start-tunnel # 🌟 新增：确保 Job 1 运行完，Job 2 才启动
    env:
      GITHUB_RUN_ID: ${{ github.run_id }}
      RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
      AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
      GMAIL_TOKEN_BASE64: ${{ secrets.GMAIL_TOKEN_BASE64 }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # 🌟 新增：从暂存区下载 Job 1 传过来的文件到当前 Job 的根目录下
      - name: 📥 Download Tunnel TXT
        uses: actions/download-artifact@v4
        with:
          name: tunnel-txt-file
          path: .

      - name: 🌐 Check Public URL
        run: |
          git pull origin main || true
          python3 scripts/check_public_url.py

      - name: 📦 Upload downloaded page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-public-page
          path: output/
          if-no-files-found: ignore
