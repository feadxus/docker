name: Start Tunnel And Check Public URL

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  tunnel-and-check:
    name: 🚇 隧道启动与公网 URL 检查
    runs-on: ubuntu-latest
    env:
      GITHUB_RUN_ID: ${{ github.run_id }}
      RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
      AGE_PRIVATE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
      AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
      GMAIL_TOKEN_BASE64: ${{ secrets.GMAIL_TOKEN_BASE64 }}
    
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          fetch-depth: 0

      - name: 🚇 1. Start Docker and Pinggy Tunnel
        run: |
          python3 scripts/start_tunnel.py

      - name: 🌐 2. Check Public URL
        run: |
          # 此时处于同一个工作区，直接就能读到 current_tunnel.txt
          python3 scripts/check_public_url.py

      - name: 📦 3. Upload downloaded page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-public-page
          path: output/
          if-no-files-found: ignore
