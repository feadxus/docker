name: Start Tunnel And Check Public URL

on:
  workflow_dispatch:
  schedule:
    - cron: "0 */6 * * *"

permissions:
  contents: read

jobs:
  start-tunnel:
    name: 🚇 Job 1 - Start Docker and Pinggy Tunnel
    runs-on: ubuntu-latest
    # ✨ 新增：输出隧道数据
    outputs:
      tunnel_data: ${{ steps.get-tunnel.outputs.TUNNEL_DATA }}
    env:
      GITHUB_RUN_ID: ${{ github.run_id }}
      RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
      AGE_PRIVATE_KEY: ${{ secrets.AGE_PRIVATE_KEY }}
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          
      - name: 🚇 Start Docker and Pinggy Tunnel
        id: get-tunnel  # ✨ 新增：设置步骤 ID
        run: |
          python3 scripts/start_tunnel.py

  check-public-url:
    name: 🌐 Job 2 - Check Public URL and Process Page
    runs-on: ubuntu-latest
    needs: start-tunnel  # ✨ 新增：显式依赖 Job 1
    env:
      GITHUB_RUN_ID: ${{ github.run_id }}
      RCLONE_SECRET_DATA: ${{ secrets.GOOGLE_FEADXUS_DRIVE }}
      AGE_PUBLIC_KEY: ${{ secrets.AGE_PUBLIC_KEY }}
      GMAIL_TOKEN_BASE64: ${{ secrets.GMAIL_TOKEN_BASE64 }}
      TUNNEL_DATA: ${{ needs.start-tunnel.outputs.tunnel_data }}  # ✨ 新增：接收隧道数据
    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🌐 Check Public URL
        run: |
          git pull origin main || true
          python3 scripts/check_public_url.py

      - name: 📦 Upload downloaded page
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: downloaded-public-page
          path: output/
          if-no-files-found: ignore
